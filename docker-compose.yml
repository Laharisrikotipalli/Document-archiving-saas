version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: archive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive}
      POSTGRES_DB: ${POSTGRES_DB:-archive}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Seeding scripts run automatically on first container startup
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive} -d ${POSTGRES_DB:-archive}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  storage:
    image: minio/minio:latest
    container_name: archive_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CLOUD_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CLOUD_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot helper that creates the bucket on MinIO before the API needs it
  createbuckets:
    image: minio/mc:latest
    container_name: archive_createbuckets
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${CLOUD_STORAGE_ACCESS_KEY_ID:-minioadmin} ${CLOUD_STORAGE_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${CLOUD_STORAGE_BUCKET_NAME:-archive-documents};
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archive_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://archive:archive@db:5432/archive}
      API_PORT: ${API_PORT:-3000}
      CLOUD_STORAGE_BUCKET_NAME: ${CLOUD_STORAGE_BUCKET_NAME:-archive-documents}
      CLOUD_STORAGE_REGION: ${CLOUD_STORAGE_REGION:-us-east-1}
      CLOUD_STORAGE_ACCESS_KEY_ID: ${CLOUD_STORAGE_ACCESS_KEY_ID:-minioadmin}
      CLOUD_STORAGE_SECRET_ACCESS_KEY: ${CLOUD_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      CLOUD_STORAGE_ENDPOINT_URL: ${CLOUD_STORAGE_ENDPOINT_URL:-http://storage:9000}
      CLOUD_STORAGE_FORCE_PATH_STYLE: "true"
      PRESIGNED_URL_EXPIRY_SECONDS: ${PRESIGNED_URL_EXPIRY_SECONDS:-900}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db_data:
  storage_data:
